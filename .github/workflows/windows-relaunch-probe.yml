name: Windows relaunch probe
on:
  push:
    branches: [t3/windows-relaunch-probe]
permissions:
  contents: read
jobs:
  x64:
    strategy:
      fail-fast: false
      matrix:
        mode: [brave-history-10000-shaped-maximized, shaped-maximized]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Keep full crash dumps of Ardia.exe
        shell: pwsh
        run: |
          $key = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\Ardia.exe"
          New-Item -Force -Path $key | Out-Null
          New-ItemProperty -Force -Path $key -Name DumpFolder -PropertyType ExpandString -Value "%LOCALAPPDATA%\CrashDumps" | Out-Null
          New-ItemProperty -Force -Path $key -Name DumpType -PropertyType DWord -Value 1 | Out-Null
      - name: Install Brave and browse a little, as a tester coming from Brave has
        if: ${{ startsWith(matrix.mode, 'brave') }}
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP "BraveBrowserSetup.exe"
          Invoke-WebRequest -Uri "https://laptop-updates.brave.com/latest/winx64" -OutFile $setup
          $run = Start-Process -FilePath $setup -ArgumentList "/silent", "/install" -Wait -PassThru
          Write-Host "Brave setup exited with $($run.ExitCode)"
          $brave = @("$env:LOCALAPPDATA\BraveSoftware\Brave-Browser\Application\brave.exe", "$env:ProgramFiles\BraveSoftware\Brave-Browser\Application\brave.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $brave) { throw "Brave did not install" }
          $process = Start-Process -FilePath $brave -ArgumentList "--no-first-run", "https://search.brave.com/search?q=nyse", "https://www.roblox.com/" -PassThru
          Start-Sleep -Seconds 25
          Get-Process brave -ErrorAction SilentlyContinue | ForEach-Object { $_.CloseMainWindow() | Out-Null }
          Start-Sleep -Seconds 5
          Get-Process brave -ErrorAction SilentlyContinue | Stop-Process -Force
          Write-Host "Brave at $brave browsed and closed"
      - name: Give Brave a large history
        if: ${{ contains(matrix.mode, 'history') }}
        shell: pwsh
        env:
          MODE: ${{ matrix.mode }}
        run: |
          $count = [int]($env:MODE -replace '.*history-', '')
          python scripts/windows/probe/seed-chromium-history.py $count "$env:LOCALAPPDATA\BraveSoftware\Brave-Browser\User Data\Default\History"
      - name: Fetch the released installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v0.2.47-nightly.3 --repo ${{ github.repository }} -p "Ardia-0.2.47-nightly.3-windows-x64-setup.exe" -D "${{ runner.temp }}/setup"
      - name: Install, close like a person and start again
        shell: pwsh
        env:
          MODE: ${{ matrix.mode }}
        run: scripts/windows/relaunch-check.ps1 -Setup "${{ runner.temp }}/setup/Ardia-0.2.47-nightly.3-windows-x64-setup.exe" -Out "${{ runner.temp }}/relaunch" -FinishOnboarding -NoUpdates -KeepLingering -Import:($env:MODE -like '*history*') -SeedEngine $(if ($env:MODE -like 'visits*' -or $env:MODE -in @('malformed','huge')) { $env:MODE } else { '' }) -TesterShape:($env:MODE -like '*shaped*') -ComingFrom $(if ($env:MODE -like 'brave*') { 'Brave' } else { 'Edge' }) -Sharing -Maximize:($env:MODE -like '*maximized') -FirstSettle $(if ($env:MODE -like '*history*') { 120 } else { 20 })
      - if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: relaunch-x64-${{ matrix.mode }}
          path: ${{ runner.temp }}/relaunch
