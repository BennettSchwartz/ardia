name: Windows relaunch probe
on:
  push:
    branches: [t3/windows-relaunch-probe]
permissions:
  contents: read
jobs:
  race:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Read a file while it is saved the way Chromium saves Local State
        shell: pwsh
        run: scripts/windows/probe/replace-file-race.ps1 -Seconds 20
